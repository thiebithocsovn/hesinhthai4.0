name: Restore, verify and publish Hesinhthai 4.0

on:
  push:
    branches: [main, fix/types-firebase-deployment-20261013, feat/wall-ai-feedback-20261013, feat/wall-inline-chat-20261014, feat/wall-openai-20261014, feat/wall-cloud-run-20261014, feat/wall-ai-providers-20261014, fix/wall-gemini-appcheck-20261015]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  teacher-password-api:
    if: github.ref == 'refs/heads/main' && vars.TEACHER_PASSWORD_API_HOST == 'cloud-run'
    runs-on: ubuntu-latest
    # A missing backend credential must not prevent publishing unrelated website updates.
    continue-on-error: true
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Check private API deployment credentials
        id: credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Teacher password API could not be deployed: FIREBASE_SERVICE_ACCOUNT_JSON is not configured.'
            echo 'Teacher password management: backend deployment needs FIREBASE_SERVICE_ACCOUNT_JSON. The email recovery option remains available.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Authenticate private API deployment
        if: steps.credentials.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up Google Cloud CLI
        if: steps.credentials.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify password API before deployment
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Test and build password API
        if: steps.credentials.outputs.configured == 'true'
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npm run test:teacher-password
          npm run build:wall-api

      - name: Update existing private API and check authentication
        id: deploy
        if: steps.credentials.outputs.configured == 'true'
        env:
          TEACHER_ADMIN_EMAIL: ${{ vars.VITE_ADMIN_EMAIL || 'tuyenthcskimhy@gmail.com' }}
        run: python3 scripts/deploy-teacher-password-api.py --apply --admin-email "$TEACHER_ADMIN_EMAIL" --github-output "$GITHUB_OUTPUT"

  build:
    needs: teacher-password-api
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    env:
      VITE_APP_BASE_PATH: /hesinhthai4.0/
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_WALL_AI_PROVIDER: ${{ vars.VITE_WALL_AI_PROVIDER || 'openai' }}
      VITE_WALL_OPENAI_API_URL: ${{ vars.VITE_WALL_OPENAI_API_URL }}
      VITE_WALL_ANTHROPIC_API_URL: ${{ vars.VITE_WALL_ANTHROPIC_API_URL }}
      VITE_ADMIN_EMAIL: ${{ vars.VITE_ADMIN_EMAIL }}
      VITE_TEACHER_ADMIN_API_URL: ${{ needs.teacher-password-api.outputs.url || vars.VITE_TEACHER_ADMIN_API_URL || 'https://hesinhthai4-0-thietbihocso.vercel.app' }}
      VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APP_CHECK_SITE_KEY }}
      VITE_FIRESTORE_CACHE_MODE: ${{ vars.VITE_FIRESTORE_CACHE_MODE || 'memory' }}
      VITE_GOOGLE_AI_MODEL: ${{ vars.VITE_GOOGLE_AI_MODEL || 'gemini-3.1-flash-lite' }}
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Restore missing application files from the original repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/trungtuyen/4.0.git "$RUNNER_TEMP/hesinhthai-upstream"
          cd "$RUNNER_TEMP/hesinhthai-upstream"
          git fetch --depth 1 origin 46a643e4715102048a6966b300852b5544351340
          git checkout --detach 46a643e4715102048a6966b300852b5544351340
          cd "$GITHUB_WORKSPACE"
          rsync -a --ignore-existing --exclude='.git/' --exclude='.github/' --exclude='node_modules/' "$RUNNER_TEMP/hesinhthai-upstream/" ./
          python3 - <<'PY'
          from pathlib import Path
          path = Path('vite.config.ts')
          content = path.read_text(encoding='utf-8')
          content = content.replace(" : '/4.0/'", " : '/hesinhthai4.0/'")
          path.write_text(content, encoding='utf-8')
          PY
          test -f src/main.tsx
          test -f public/service-worker.js
          test -f scripts/test-application-catalog.ts
          echo "Source tree restored."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check Gemini App Check configuration without exposing the key
        shell: bash
        run: |
          if [[ -z "${VITE_FIREBASE_APP_CHECK_SITE_KEY:-}" ]]; then
            echo "::warning::Firebase Gemini is not ready: VITE_FIREBASE_APP_CHECK_SITE_KEY is not configured."
            echo "### Gemini App Check: missing public site key" >> "$GITHUB_STEP_SUMMARY"
            echo "Register the Web app with reCAPTCHA Enterprise and set VITE_FIREBASE_APP_CHECK_SITE_KEY as a GitHub Actions variable." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Gemini App Check site key is configured (registration and real attestation still require browser verification)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate TypeScript (required)
        run: npm run lint

      - name: Verify exam answers, manual grading and printed receipts
        run: |
          npm run test:exam-result-deletion
          npm run test:exam-class-receipts
          npm run test:exam-manual-grading
          npm run test:exam-receipt
          npm run test:teacher-printing
          npm run test:exam-privacy

      - name: Run learning wall and app checks
        run: |
          npm run test:learning-wall
          npm run test:wall-assessment
          npm run test:wall-chat
          npm run test:wall-openai
          npm run test:wall-providers
          npm run test:wall-api
          npm run test:ai-services
          npm run test:firebase-ai-diagnostics
          npm run test:platform
          npm run test:kpi-analytics
          npm run test:auth-flow
          npm run test:teacher-password
          npm run test:smart-timetable
          npm run test:question-engine
          npm run test:question-pptx
          npm run test:plicker-student-sync
          npm run test:hardening
          npm run test:security-hardening
          npm run test:pwa

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Firebase data access using Firestore emulator
        run: npx --yes firebase-tools@^15.17.0 emulators:exec --project demo-learning-wall --config firebase.learning-wall.json --only firestore "npm run test:learning-wall-rules && npm run test:kpi-rules && LEARNING_WALL_RULES_FILE=firestore.learning-wall.rules npm run test:learning-wall-rules && npm run test:exam-access-rules && EXAM_RULES_FILE=firestore.learning-wall.rules npm run test:exam-access-rules"

      - name: Install Chromium for UI verification
        run: npx playwright install --with-deps chromium

      - name: Verify teacher AI workflow on desktop and mobile
        run: npm run test:wall-assessment-ui

      - name: Verify teacher password dialog on desktop and mobile
        run: npm run test:teacher-password-ui

      - name: Save UI verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wall-ai-ui-results
          path: |
            wall-ai-ui-results/
            teacher-password-ui-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build static website
        run: npm run build:static

      - name: Verify private API server bundle
        run: npm run build:wall-api

      - name: Ensure GitHub Pages files exist
        run: |
          test -s dist/index.html
          test -f dist/smartclass.webmanifest
          test -f dist/service-worker.js
          printf '' > dist/.nojekyll

      - name: Save restored source and fixes
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Restore ecosystem application and fix GitHub Pages deployment"
            git push origin HEAD:main
          fi

      - name: Deploy Firestore rules only when explicitly enabled
        if: github.ref == 'refs/heads/main' && vars.ENABLE_FIRESTORE_RULES_DEPLOY == 'true'
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/hesinhthai-firebase.json
        run: |
          if [[ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo '::error::ENABLE_FIRESTORE_RULES_DEPLOY is enabled but FIREBASE_SERVICE_ACCOUNT_JSON is not configured.'
            exit 1
          fi
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          npm run deploy:firestore

      - name: Setup GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload website
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Publish a verified build even when the optional Cloud Run ancestor was skipped.
    if: always() && !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

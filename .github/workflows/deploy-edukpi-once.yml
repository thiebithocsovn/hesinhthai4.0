name: Deploy EduKPI Firestore rules (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-edukpi-once.yml

permissions:
  contents: read

jobs:
  deploy-edukpi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate app TypeScript and KPI unit models
        run: |
          npm run lint
          npm run test:platform
          npm run test:catalog

      - name: Install Java for Firebase emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify current Firestore rules, tenant isolation and old modules
        run: |
          npx --yes firebase-tools@^15.17.0 emulators:exec --project demo-learning-wall --config firebase.learning-wall.json --only firestore "npm run test:kpi-rules && npm run test:exam-access-rules && npm run test:learning-wall-rules"

      - name: Deploy Firestore security rules to configured project/database
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/edukpi-firebase-credentials.json
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_JSON. No production database rules were changed."
            echo "EduKPI UI is published, but database activation requires a Firebase service account with appropriate deployment rights." >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          npm run deploy:firestore
          echo "Deployed verified Firestore rules for EduKPI to the Firebase project/database configured in firebase.json." >> "$GITHUB_STEP_SUMMARY"

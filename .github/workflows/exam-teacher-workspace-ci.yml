name: Teacher exam workspace compatibility

on:
  pull_request:
    paths:
      - 'src/components/ExamManagerLegacy.tsx'
      - 'src/components/UnifiedStudentExamRunner.tsx'
      - 'src/lib/examCandidateWorkspace.ts'
      - 'src/lib/examOperations.ts'
      - 'src/lib/examCouncil.ts'
      - 'src/lib/examClassAttendance.ts'
      - 'scripts/test-exam-class-attendance.ts'
      - 'scripts/test-security-hardening.ts'
      - 'src/lib/examStaffAccess.ts'
      - 'scripts/test-exam-staff-rules.ts'
      - 'firestore.rules'
      - 'src/lib/examManualGrading.ts'
      - 'scripts/test-exam-council.ts'
      - 'scripts/test-exam-operations-v3.ts'
      - 'scripts/test-exam-candidate-v2.ts'
      - 'src/components/TeacherExam*.tsx'
      - 'src/lib/teacherExamWorkspace.ts'
      - 'src/lib/examReadiness.ts'
      - 'src/components/TeacherQuestionBank.tsx'
      - 'scripts/test-exam-professional-workspace.ts'
      - 'scripts/test-teacher-exam-workspace.ts'
      - 'package.json'
      - '.github/workflows/exam-teacher-workspace-ci.yml'
  push:
    branches:
      - feature/exam-teacher-workspace-20261123
      - feature/exam-candidate-v2-20261124
      - feature/exam-operations-v3-20261124
      - feature/exam-school-council-20261124
      - feature/exam-staff-rbac-20261124
      - feature/exam-workspace-design-20261124
      - fix/exam-class-roster-20261124

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Test teacher dashboard and old data compatibility
        run: npm run test:exam-workspace && npm run test:exam-professional && node --import tsx scripts/test-exam-candidate-v2.ts && node --import tsx scripts/test-exam-operations-v3.ts && node --import tsx scripts/test-exam-council.ts
      - name: Test student portal, isolation and exam access
        run: |
          npm run test:teacher-isolation
          npm run test:exam-privacy
          npm run test:student-portal
          npm run test:exam-result-deletion
          npm run test:exam-class-receipts
          npm run test:exam-manual-grading
          npm run test:exam-receipt
          npm run test:security-hardening
          node --import tsx scripts/test-exam-class-attendance.ts
      - name: Typecheck
        run: npm run lint
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test staff authorization and legacy exam rules against emulator
        run: npx --yes firebase-tools@^15.17.0 emulators:exec --project demo-learning-wall --config firebase.learning-wall.json --only firestore "npm run test:exam-access-rules && node --import tsx scripts/test-exam-staff-rules.ts"
      - name: Build static site without publishing
        run: npm run build:static

name: Teacher exam workspace compatibility

on:
  pull_request:
    paths:
      - 'src/components/ExamManagerLegacy.tsx'
      - 'src/components/TeacherExam*.tsx'
      - 'src/lib/teacherExamWorkspace.ts'
      - 'scripts/test-teacher-exam-workspace.ts'
      - 'package.json'
      - '.github/workflows/exam-teacher-workspace-ci.yml'
  push:
    branches:
      - feature/exam-teacher-workspace-20261123

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Test teacher dashboard and old data compatibility
        run: npm run test:exam-workspace
      - name: Test student portal, isolation and exam access
        run: |
          npm run test:teacher-isolation
          npm run test:exam-privacy
          npm run test:student-portal
          npm run test:scalability
      - name: Typecheck
        run: npm run lint
      - name: Build static site without publishing
        run: npm run build:static

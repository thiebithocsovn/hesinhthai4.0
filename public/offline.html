<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <title>Lớp Học Thông Minh 4.0</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font: 16px/1.6 system-ui, sans-serif; color: #0f172a; background: #f8fafc; }
      main { width: min(460px, 100%); padding: 34px; text-align: center; border-radius: 24px; border: 1px solid #e2e8f0; background: #fff; box-shadow: 0 18px 45px #0f172a12; }
      img { width: 84px; height: 84px; border-radius: 20px; }
      h1 { margin: 20px 0 8px; font-size: 24px; }
      p { margin: 0 0 24px; color: #64748b; }
      button { padding: 12px 22px; border: 0; border-radius: 12px; color: #fff; background: #4f46e5; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="./icons/plicker-192.png" alt="Biểu tượng Lớp Học Thông Minh 4.0" />
      <h1>Chưa có kết nối Internet</h1>
      <p>Những ứng dụng, lớp học và nội dung đã mở vẫn được lưu trên thiết bị. Hãy kết nối mạng khi cần đồng bộ dữ liệu mới.</p>
      <button type="button" onclick="window.location.reload()">Thử lại</button>
    </main>
  </body>
</html>
